                  <div className="flex flex-wrap items-center justify-between gap-2">
                    <div className="flex items-center gap-2.5">
                      <div className="w-9 h-9 rounded-xl bg-emerald-500/15 border border-emerald-400/30 flex items-center justify-center text-emerald-300">
                        <GitBranch className="w-5 h-5" />
                      </div>
                      <div>
                        <h3 className="text-base sm:text-xl font-bold text-emerald-100">
                          {lang === 'si'
                            ? 'දාර්ශනික තීරණ වෘක්ෂය (Philosophical Decision Tree)'
                            : 'Philosophical Decision Tree'}
                        </h3>
                        <p className="text-xs text-slate-400">
                          {lang === 'si'
                            ? 'ඕනෑම අතු අග්‍රයක් (Node) මත ක්ලික් කර එහිදී සිදු වූ වෙනස සහ අත්හළ විකල්පය බලන්න'
                            : 'Click any branch node to inspect how your choice shifted the meters vs. the road not taken'}
                        </p>
                      </div>
                    </div>
                  </div>

                  {/* Tree Trunk & Branches */}
                  <div className="relative pl-4 sm:pl-7 border-l-2 border-dashed border-emerald-500/40 space-y-4">
                    {/* Root Node */}
                    <div className="relative">
                      <span className="absolute -left-[23px] sm:-left-[35px] top-2.5 w-4 h-4 rounded-full bg-amber-400 ring-4 ring-amber-400/20" />
                      <div className="p-3 rounded-xl bg-slate-950/90 border border-amber-500/30 text-xs text-amber-200 font-semibold flex flex-wrap items-center justify-between gap-2">
                        <span>
                          {lang === 'si'
                            ? '🌱 මූල ලක්ෂ්‍යය (Root): ආරම්භක සමතුලිතතාව'
                            : '🌱 Root Node: Initial Equilibrium'}
                        </span>
                        <span className="font-mono text-[11px] text-slate-400">
                          FW 50% · DW 50% · Tension ~43%
                        </span>
                      </div>
                    </div>

                    {history.map((item, idx) => {
                      const scObj = SCENARIOS.find((s) => s.id === item.scenarioId);
                      const scText = scObj?.[lang];
                      const chosenObj = scText?.choices.find((c) => c.id === item.choiceId);
                      const unchosenObj = scText?.choices.find((c) => c.id !== item.choiceId);
                      const schoolObj = SEVEN_SCHOOLS.find((l) => l.id === item.schoolId);
                      const isSelected = activeTreeNode === idx;

                      return (
                        <div key={idx} className="relative">
                          <button
                            onClick={() => setActiveTreeNode(idx)}
                            className={`w-full text-left p-3.5 sm:p-4 rounded-2xl border transition-all cursor-pointer ${
                              isSelected
                                ? 'bg-gradient-to-r from-emerald-950/50 via-slate-950 to-amber-950/30 border-emerald-400/60 shadow-lg shadow-emerald-950/40'
                                : 'bg-slate-950/85 hover:bg-slate-900/90 border-slate-800'
                            }`}
                          >
                            <span
                              className={`absolute -left-[23px] sm:-left-[35px] top-5 w-4 h-4 rounded-full transition-all ${
                                isSelected
                                  ? 'bg-emerald-400 ring-4 ring-emerald-400/25 scale-110'
                                  : 'bg-slate-700 border-2 border-emerald-400/60'
                              }`}
                            />

                            <div className="flex flex-wrap items-center justify-between gap-2 mb-1.5">
                              <span className="text-xs font-bold text-emerald-300">
                                🌿 {lang === 'si' ? `ශාඛාව ${idx + 1}: ` : `Branch ${idx + 1}: `}
                                {scText?.title}
                              </span>
                              <div className="flex items-center gap-1.5 font-mono text-[11px]">
                                <span className="px-2 py-0.5 rounded bg-emerald-500/15 text-emerald-300">
                                  FW {formatDelta(item.fwDeltaTotal)}
                                </span>
                                <span className="px-2 py-0.5 rounded bg-sky-500/15 text-sky-300">
                                  DW {formatDelta(item.dwDeltaTotal)}
                                </span>
                                <span className="px-2 py-0.5 rounded bg-amber-500/15 text-amber-300">
                                  T {item.tensionSnapshot}%
                                </span>
                              </div>
                            </div>

                            <p className="text-xs sm:text-sm font-semibold text-slate-100">
                              ✓ {chosenObj?.label}
                            </p>

                            {unchosenObj && (
                              <p className="text-[11px] text-slate-500 mt-1 line-through">
                                ↳ {lang === 'si' ? 'අත්හළ අතු මාර්ගය: ' : 'Unchosen fork: '}
                                {unchosenObj.label}
                              </p>
                            )}

                            <div className="mt-2 flex flex-wrap items-center gap-2 text-[11px]">
                              <span className="px-2.5 py-0.5 rounded-full bg-slate-900 border border-slate-700 text-amber-200">
                                {schoolObj?.[lang].name}
                              </span>
                              {item.rewindAnswer && (
                                <span className="px-2.5 py-0.5 rounded-full bg-slate-900 border border-slate-700 text-sky-300">
                                  Rewind: {item.rewindAnswer.toUpperCase()}
                                </span>
                              )}
                            </div>
                          </button>
                        </div>
                      );
                    })}
                  </div>

                  {/* Selected Tree Node Inspector */}
                  {selectedNodeData && (() => {
                    const scObj = SCENARIOS.find((s) => s.id === selectedNodeData.scenarioId);
                    const scText = scObj?.[lang];
                    const chosenObj = scText?.choices.find(
                      (c) => c.id === selectedNodeData.choiceId
                    );
                    const unchosenObj = scText?.choices.find(
                      (c) => c.id !== selectedNodeData.choiceId
                    );
                    const schoolObj = SEVEN_SCHOOLS.find(
                      (l) => l.id === selectedNodeData.schoolId
                    );

                    return (
                      <div className="p-4 sm:p-5 rounded-2xl bg-slate-950/95 border border-amber-400/35 space-y-3">
                        <div className="flex items-center justify-between gap-2">
                          <span className="text-xs font-bold uppercase tracking-wider text-amber-300">
                            {lang === 'si'
                              ? `තෝරාගත් ශාඛාවේ දාර්ශනික විවරණය (#${activeTreeNode + 1})`
                              : `Selected Branch Analysis (#${activeTreeNode + 1})`}
                          </span>
                          <span className="text-xs font-mono text-emerald-300">
                            Snapshot: FW {selectedNodeData.fwSnapshot}% | DW{' '}
                            {selectedNodeData.dwSnapshot}% | Paradox{' '}
                            {selectedNodeData.tensionSnapshot}%
                          </span>
                        </div>

                        <p className="text-xs sm:text-sm text-slate-200 leading-relaxed">
                          {schoolObj?.[lang].deepAnalysis}
                        </p>

                        {unchosenObj && (
                          <div className="p-3 rounded-xl bg-slate-900/90 border border-slate-800 text-xs text-slate-400 leading-relaxed">
                            <span className="font-bold text-slate-300">
                              {lang === 'si'
                                ? 'අනෙක් අතට ඔබ අත්හළ මාර්ගය තෝරා ගත්තේ නම්: '
                                : 'Had you taken the unchosen branch: '}
                            </span>
                            “{unchosenObj.label}” —{' '}
                            {lang === 'si'
                              ? 'එම මොහොතේදීම ඔබේ වගකීම, හේතුඵල සම්බන්ධය සහ පරස්පරතා මීටරය වෙනස් දිශාවකට යොමු වන්නට ඉඩ තිබුණි.'
                              : 'your moral framing, causal chain, and paradox balance at that crossroads would have diverged.'}
                          </div>
                        )}
                      </div>
                    );
                  })()}

                  {/* Bottom Actions */}
                  <div className="flex flex-col sm:flex-row gap-3 pt-1">
                    <button
                      onClick={handleStartGame}
                      className="flex-1 py-3.5 px-6 rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-bold text-sm sm:text-base shadow-lg shadow-amber-500/20 transition-all flex items-center justify-center gap-2 cursor-pointer"
                    >
                      <RotateCcw className="w-4 h-4" />
                      <span>
                        {lang === 'si'
                          ? 'වෙනත් මාර්ගයක් අත්හදා බලන්න (Replay)'
                          : 'Explore Another Path'}
                      </span>
                    </button>

                    <button
                      onClick={() => setShowTriadModal(true)}
                      className="py-3.5 px-5 rounded-xl bg-slate-950 hover:bg-slate-800 border border-amber-500/40 text-amber-200 font-semibold text-xs sm:text-sm flex items-center justify-center gap-2 transition-all cursor-pointer"
                    >
                      <Triangle className="w-4 h-4 text-amber-400" />
                      <span>
                        {lang === 'si' ? 'තාර්කික ත්‍රිකෝණ පරීක්ෂාව' : 'Logical Triad Explorer'}
                      </span>
                    </button>
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* LOGICAL TRIAD MODAL */}
          {showTriadModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-3.5 sm:p-5">
              <div className="bg-slate-900 border border-amber-500/35 rounded-2xl max-w-lg w-full p-5 sm:p-6 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
                <div className="flex items-center justify-between gap-2 border-b border-slate-800 pb-3">
                  <div className="flex items-center gap-2">
                    <Triangle className="w-5 h-5 text-amber-400" />
                    <h3 className="text-base sm:text-lg font-bold text-amber-100">
                      {lang === 'si'
                        ? 'තාර්කික ත්‍රිකෝණ පරීක්ෂාව (The Logical Triad)'
                        : 'The Logical Triad Explorer'}
                    </h3>
                  </div>
                  <button
                    onClick={() => setShowTriadModal(false)}
                    className="p-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 cursor-pointer"
                  >
                    <X className="w-4 h-4" />
                  </button>
                </div>

                <p className="text-xs sm:text-sm text-slate-300 leading-relaxed">
                  {lang === 'si'
                    ? 'පහත ස්ලයිඩර (Sliders) 3 වෙනස් කර බලන්න: මෙම කරුණු 3ම 100% ක් ලෙස තබා ගන්නා විට ඇතිවන තාර්කික ගැටුම (Logical Collision) නිරීක්ෂණය කරන්න.'
                    : 'Adjust the 3 sliders below to see how holding all three propositions at 100% generates a direct logical collision.'}
                </p>

                <div className="space-y-3.5 bg-slate-950/90 border border-slate-800 rounded-xl p-4">
                  <div>
                    <div className="flex justify-between text-xs font-semibold text-sky-300 mb-1">
                      <span>
                        {lang === 'si'
                          ? '1. දෙවියන්ගේ නොවරදින පූර්ව දැනුම (Omniscience)'
                          : '1. Infallible Divine Foreknowledge'}
                      </span>
                      <span className="font-mono">{triadOmniscience}%</span>
                    </div>
                    <input
                      type="range"
                      min="0"
                      max="100"
                      value={triadOmniscience}
                      onChange={(e) => setTriadOmniscience(Number(e.target.value))}
                      className="w-full accent-sky-400 cursor-pointer"
                    />
                  </div>

                  <div>
                    <div className="flex justify-between text-xs font-semibold text-emerald-300 mb-1">
                      <span>
                        {lang === 'si'
                          ? '2. වෙනස් තීරණයක් ගැනීමේ නිදහස (Free Will)'
                          : '2. Power to Choose Otherwise (Free Will)'}
                      </span>
                      <span className="font-mono">{triadFreeWill}%</span>
                    </div>
                    <input
                      type="range"
                      min="0"
                      max="100"
                      value={triadFreeWill}
                      onChange={(e) => setTriadFreeWill(Number(e.target.value))}
                      className="w-full accent-emerald-400 cursor-pointer"
                    />
                  </div>

                  <div>
                    <div className="flex justify-between text-xs font-semibold text-purple-300 mb-1">
                      <span>
                        {lang === 'si'
                          ? '3. දඬුවම් / පින් ලැබීමේ යුක්තිය (Accountability)'
                          : '3. Just Moral Accountability'}
                      </span>
                      <span className="font-mono">{triadAccountability}%</span>
                    </div>
                    <input
                      type="range"
                      min="0"
                      max="100"
                      value={triadAccountability}
                      onChange={(e) => setTriadAccountability(Number(e.target.value))}
                      className="w-full accent-purple-400 cursor-pointer"
                    />
                  </div>
                </div>

                <div
                  className={`p-4 rounded-xl border ${
                    triadCollisionScore >= 80
                      ? 'bg-rose-950/40 border-rose-500/50 text-rose-100'
                      : 'bg-slate-950 border-slate-800 text-slate-200'
                  }`}
                >
                  <div className="flex items-center justify-between text-xs font-bold mb-1.5">
                    <span className="flex items-center gap-1.5 text-amber-300">
                      <Sliders className="w-4 h-4" />
                      <span>
                        {lang === 'si' ? 'තාර්කික ගැටුම් මට්ටම:' : 'Logical Collision Index:'}
                      </span>
                    </span>
                    <span className="font-mono text-sm text-amber-300">
                      {triadCollisionScore}%
                    </span>
                  </div>
                  <p className="text-xs leading-relaxed">
                    {triadCollisionScore >= 80
                      ? lang === 'si'
                        ? '⚠️ තාර්කික පරස්පරතාව උපරිමයි! දෙවියන් ඔබ කරන දේ 100% ක් නොවරදින ලෙස කලින් දන්නේ නම්, ඔබට එය වෙනස් කළ නොහැක; වෙනස් කළ නොහැකි දෙයකට දඬුවම් කිරීම යුක්තිය සමඟ ගැටේ.'
                        : '⚠️ Maximum Logical Tension! If God infallibly foreknows X, you cannot do otherwise than X—colliding with libertarian freedom and moral blame.'
                      : lang === 'si'
                      ? '✓ එක් සාධකයක් අඩු කළ විට තාර්කික පරස්පරතාව අඩු වේ — මු\'තසිලා සහ ජබ්‍රියා ගුරුකුල කළේ මෙලෙස එක් අන්තයක් අඩු කිරීමයි.'
                      : '✓ Reducing one corner eases the logical contradiction—which is precisely how Mu\'tazila and Jabriyya resolved the dilemma.'}
                  </p>
                </div>
              </div>
            </div>
          )}

          <footer className="relative z-10 border-t border-slate-900 py-3 px-4 text-center text-[11px] text-slate-500">
            {lang === 'si'
              ? 'සම්භාව්‍ය ඉස්ලාමීය දේවධර්මය (Kalam) සහ මතවාද 7 ඇසුරින් සකස් කරන ලද අධ්‍යාපනික අත්දැකීමකි.'
              : 'An educational philosophical simulation across all 7 classical Islamic schools.'}
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
